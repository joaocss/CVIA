<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CVIA — Assistente CV CRM</title>
<style>
  :root {
    --navy: #12344D;
    --navy-dark: #0c2536;
    --teal: #00B389;
    --teal-dark: #088273;
    --teal-light: #E3FFF9;
    --bg: #F3F3FC;
    --card-border: #EBEFF3;
    --text-muted: #757575;
    --danger: #C0392B;
    --warn: #B8860B;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--navy);
  }
  #app { display: flex; flex-direction: column; height: 100vh; max-width: 820px; margin: 0 auto; }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--navy-dark) 100%);
    color: #fff;
    padding: 16px 20px;
    display: flex;
    align-items: center;
    gap: 12px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.08);
  }
  .logo-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: var(--teal);
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: var(--navy-dark);
    flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  header p { font-size: 12px; margin: 2px 0 0; color: #C7D6E0; }
  #status-badge {
    margin-left: auto;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 999px;
    background: rgba(255,255,255,0.12);
    color: #C7D6E0;
    white-space: nowrap;
  }
  #status-badge.ok { background: rgba(0,179,137,0.25); color: #E3FFF9; }
  #status-badge.erro { background: rgba(192,57,43,0.3); color: #ffd8d3; }
  #btn-nova-conversa {
    background: rgba(255,255,255,0.12);
    color: #C7D6E0;
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 11px;
    cursor: pointer;
  }
  #btn-nova-conversa:hover { background: rgba(255,255,255,0.22); color: #fff; }

  .retomar-banner {
    margin: 16px 16px 0;
    background: #fff;
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--teal);
    border-radius: 12px;
    padding: 14px 16px;
    font-size: 13px;
  }
  .retomar-banner p { margin: 0 0 4px; color: var(--navy); }
  .retomar-banner .quando { color: var(--text-muted); font-size: 11.5px; margin-bottom: 10px; }
  .retomar-banner .acoes { display: flex; gap: 8px; }
  .retomar-banner button {
    border-radius: 999px; padding: 7px 14px; font-size: 12.5px; cursor: pointer; border: 1px solid transparent;
  }
  .retomar-banner .continuar { background: var(--teal); color: #fff; }
  .retomar-banner .continuar:hover { background: var(--teal-dark); }
  .retomar-banner .nova { background: #fff; color: var(--navy); border-color: var(--card-border); }
  .retomar-banner .nova:hover { border-color: var(--teal); }

  .divisor-retomada {
    text-align: center; font-size: 11px; color: var(--text-muted);
    margin: 4px 16px; padding-top: 8px; border-top: 1px dashed var(--card-border);
  }

  #mensagens {
    flex: 1;
    overflow-y: auto;
    padding: 20px 16px 8px;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .estado-vazio {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    max-width: 420px;
  }
  .estado-vazio .logo-mark { margin: 0 auto 14px; width: 48px; height: 48px; font-size: 20px; }
  .estado-vazio h2 { color: var(--navy); font-size: 17px; margin: 0 0 6px; }
  .estado-vazio p { font-size: 13px; line-height: 1.5; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  .chip {
    border: 1px solid var(--card-border);
    background: #fff;
    color: var(--navy);
    border-radius: 999px;
    padding: 7px 14px;
    font-size: 12.5px;
    cursor: pointer;
    transition: border-color .15s, background .15s;
  }
  .chip:hover { border-color: var(--teal); background: var(--teal-light); }

  .msg { display: flex; max-width: 88%; }
  .msg.usuario { align-self: flex-end; }
  .msg.assistente { align-self: flex-start; }

  .bolha {
    padding: 12px 15px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.55;
  }
  .msg.usuario .bolha {
    background: var(--navy);
    color: #fff;
    border-bottom-right-radius: 3px;
  }
  .msg.assistente .bolha {
    background: #fff;
    color: #26333d;
    border: 1px solid var(--card-border);
    border-left: 3px solid var(--teal);
    border-bottom-left-radius: 3px;
  }
  .msg.assistente.recusado .bolha { border-left-color: var(--warn); }
  .bolha p { margin: 0 0 8px; }
  .bolha p:last-child { margin-bottom: 0; }
  .bolha ul, .bolha ol { margin: 6px 0; padding-left: 20px; }
  .bolha strong { color: var(--navy); }
  .msg.usuario .bolha strong { color: #fff; }
  .bolha code {
    background: var(--teal-light); color: var(--teal-dark);
    padding: 1px 5px; border-radius: 4px; font-size: 12.5px;
  }
  .bolha h2, .bolha h3, .artigo-corpo h2, .artigo-corpo h3 {
    margin: 12px 0 6px; line-height: 1.3; color: var(--navy);
  }
  .bolha h2, .artigo-corpo h2 { font-size: 15px; }
  .bolha h3, .artigo-corpo h3 { font-size: 13.5px; }
  .bolha img, .artigo-corpo img {
    max-width: 100%; height: auto; display: block; margin: 8px 0;
    border: 1px solid var(--card-border); border-radius: 8px;
  }
  .bolha pre, .artigo-corpo pre {
    background: var(--navy-dark); color: #e6f6f2; padding: 10px 12px;
    border-radius: 8px; overflow-x: auto; font-size: 12.5px; margin: 8px 0;
    white-space: pre-wrap; word-break: break-word;
  }
  .artigo-corpo ol { list-style: decimal; }

  /* Artigo apresentado na integra (texto + prints), abaixo da resposta */
  .artigo-integro {
    margin-top: 12px; border: 1px solid var(--card-border);
    border-radius: 12px; overflow: hidden; background: #fff;
  }
  .artigo-integro > summary {
    cursor: pointer; list-style: none; padding: 10px 14px;
    background: var(--teal-light); color: var(--navy);
    font-weight: 600; font-size: 13px;
    display: flex; align-items: center; gap: 8px;
  }
  .artigo-integro > summary::-webkit-details-marker { display: none; }
  .artigo-integro > summary .selo {
    font-size: 10.5px; font-weight: 600; color: var(--teal-dark);
    background: #fff; border: 1px solid var(--teal); border-radius: 999px;
    padding: 1px 8px; margin-left: auto; white-space: nowrap;
  }
  .artigo-corpo {
    padding: 4px 16px 14px; font-size: 13.5px; line-height: 1.6; color: #26333d;
  }
  .artigo-corpo p { margin: 0 0 8px; }
  .artigo-corpo a { color: var(--teal-dark); }
  .artigo-corpo strong { color: var(--navy); }

  .fontes {
    margin-top: 10px;
    padding-top: 8px;
    border-top: 1px dashed var(--card-border);
    display: flex; flex-direction: column; gap: 5px;
  }
  .fonte-item {
    font-size: 11.5px;
    display: flex;
    align-items: baseline;
    gap: 6px;
  }
  .fonte-item a { color: var(--teal-dark); text-decoration: none; }
  .fonte-item a:hover { text-decoration: underline; }
  .fonte-score {
    color: var(--text-muted);
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }

  .meta-linha {
    margin-top: 8px;
    font-size: 10.5px;
    color: var(--text-muted);
    display: flex; gap: 8px; align-items: center;
  }
  .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  .dot.alto { background: var(--teal); }
  .dot.baixo { background: var(--warn); }

  .digitando { display: flex; gap: 4px; padding: 6px 2px; }
  .digitando span {
    width: 6px; height: 6px; border-radius: 50%; background: var(--teal);
    animation: pulsa 1.1s infinite ease-in-out;
  }
  .digitando span:nth-child(2) { animation-delay: .15s; }
  .digitando span:nth-child(3) { animation-delay: .3s; }
  @keyframes pulsa { 0%, 60%, 100% { opacity: .25; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-3px); } }

  #composer {
    padding: 14px 16px 18px;
    background: var(--bg);
    display: flex;
    gap: 10px;
    align-items: flex-end;
    border-top: 1px solid var(--card-border);
  }
  #campo {
    flex: 1;
    resize: none;
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 11px 14px;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    background: #fff;
    color: var(--navy);
  }
  #campo:focus { outline: none; border-color: var(--teal); }
  #enviar {
    background: var(--teal);
    color: #fff;
    border: none;
    border-radius: 12px;
    width: 44px; height: 44px;
    flex-shrink: 0;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    transition: background .15s;
  }
  #enviar:hover:not(:disabled) { background: var(--teal-dark); }
  #enviar:disabled { background: #B8C2CC; cursor: not-allowed; }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: #d7dee4; border-radius: 4px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo-mark">CV</div>
    <div>
      <h1>CVIA</h1>
      <p>Assistente da Base de Conhecimento CV CRM</p>
    </div>
    <button id="btn-nova-conversa" title="Limpa o contexto atual e começa do zero">nova conversa</button>
    <div id="status-badge">verificando…</div>
  </header>

  <div id="mensagens">
    <div class="estado-vazio" id="estado-vazio">
      <div class="logo-mark">CV</div>
      <h2>Como posso ajudar?</h2>
      <p>Pergunte sobre a Base de Ajuda ou a API do CV CRM. As respostas usam apenas o conteúdo indexado — sem invenção.</p>
      <div class="chips">
        <button class="chip" data-q="Como cadastrar um webhook?">Como cadastrar um webhook?</button>
        <button class="chip" data-q="Como autenticar na API do CV CRM?">Como autenticar na API?</button>
        <button class="chip" data-q="Quais campos preciso enviar para cadastrar um lead via API?">Cadastrar lead via API</button>
      </div>
    </div>
  </div>

  <form id="composer">
    <textarea id="campo" rows="1" placeholder="Digite sua pergunta…" autofocus></textarea>
    <button id="enviar" type="submit" aria-label="Enviar">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M3 12L21 3L14 21L11 13L3 12Z" stroke="white" stroke-width="2" stroke-linejoin="round"/></svg>
    </button>
  </form>
</div>

<script>
const mensagensEl = document.getElementById('mensagens');
const estadoVazio = document.getElementById('estado-vazio');
const campo = document.getElementById('campo');
const composer = document.getElementById('composer');
const enviarBtn = document.getElementById('enviar');
const statusBadge = document.getElementById('status-badge');
const btnNovaConversa = document.getElementById('btn-nova-conversa');
let historico = [];
let carregando = false;

// Identificador anonimo da sessao — vira o "usuario" nas estatisticas do
// painel ate a autenticacao via API do Freshdesk existir. Guardado no
// navegador, sobrevive a fechar a aba (diferente do historico em si, que
// e reconstruido do servidor a cada carregamento via /sessao/retomar).
function getSessaoId() {
  let id = localStorage.getItem('cvia_sessao_id');
  if (!id) {
    id = (crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random().toString(16).slice(2)}`);
    localStorage.setItem('cvia_sessao_id', id);
  }
  return id;
}
const sessaoId = getSessaoId();

async function checarSaude() {
  try {
    const r = await fetch('/health');
    const d = await r.json();
    if (d.status === 'ok') {
      statusBadge.textContent = `online · ${d.indice_total} trechos`;
      statusBadge.className = 'ok';
    } else {
      statusBadge.textContent = 'índice vazio';
      statusBadge.className = 'erro';
    }
  } catch (e) {
    statusBadge.textContent = 'offline';
    statusBadge.className = 'erro';
  }
}
checarSaude();

function fmtQuando(iso) {
  try {
    // postgres manda "YYYY-MM-DD HH:MM:SS+00:00"; troca o espaco por "T"
    // pra garantir parse consistente entre navegadores.
    const d = new Date(iso.replace(' ', 'T'));
    const diffMin = Math.round((Date.now() - d.getTime()) / 60000);
    if (diffMin < 2) return 'agora há pouco';
    if (diffMin < 60) return `há ${diffMin} min`;
    const diffH = Math.round(diffMin / 60);
    if (diffH < 24) return `há ${diffH}h`;
    const diffD = Math.round(diffH / 24);
    return `há ${diffD} dia${diffD > 1 ? 's' : ''}`;
  } catch (e) { return ''; }
}

async function checarRetomar() {
  try {
    const r = await fetch(`/sessao/retomar?sessao_id=${encodeURIComponent(sessaoId)}`);
    if (!r.ok) return;
    const d = await r.json();
    if (!d.tem_historico) return;
    mostrarBannerRetomar(d);
  } catch (e) { /* sem retomada, segue com o estado vazio normal */ }
}

function mostrarBannerRetomar(d) {
  limparEstadoVazio();
  const banner = document.createElement('div');
  banner.className = 'retomar-banner';
  banner.innerHTML = `
    <p>Você estava perguntando sobre: <strong>"${escapeHtml(d.ultima_pergunta)}"</strong></p>
    <div class="quando">${escapeHtml(fmtQuando(d.quando))} · quer continuar esse assunto?</div>
    <div class="acoes">
      <button class="continuar">Continuar de onde parei</button>
      <button class="nova">Começar assunto novo</button>
    </div>
  `;
  mensagensEl.appendChild(banner);

  banner.querySelector('.continuar').addEventListener('click', () => {
    banner.remove();
    historico = d.historico.slice(-6);
    for (const [autor, texto] of d.historico) {
      adicionarMensagem(autor === 'usuario' ? 'usuario' : 'assistente', texto);
    }
    const divisor = document.createElement('div');
    divisor.className = 'divisor-retomada';
    divisor.textContent = 'conversa retomada · continue a partir daqui';
    mensagensEl.appendChild(divisor);
    campo.focus();
  });
  banner.querySelector('.nova').addEventListener('click', () => {
    banner.remove();
    mostrarEstadoVazioSeVazio();
  });
}

function mostrarEstadoVazioSeVazio() {
  if (mensagensEl.children.length === 0) {
    mensagensEl.appendChild(estadoVazio);
  }
}

btnNovaConversa.addEventListener('click', () => {
  historico = [];
  mensagensEl.innerHTML = '';
  mensagensEl.appendChild(estadoVazio);
  campo.focus();
});

checarRetomar();

function escapeHtml(s) {
  return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
}

// markdown: cabecalhos (##/###), imagens ![alt](url), links [t](u), listas
// ordenadas (1.) e nao ordenadas (-) com aninhamento por indentacao, blocos de
// codigo (```), **negrito** e `codigo`. Suporta o artigo integro multimodal.
function inlineMd(s) {
  s = escapeHtml(s);
  s = s.replace(/!\[([^\]]*)\]\((https?:[^\s)]+)\)/g,
    '<img src="$2" alt="$1" loading="lazy">');
  s = s.replace(/\[([^\]]+)\]\((https?:[^\s)]+)\)/g,
    '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}

function renderMarkdown(texto) {
  const linhas = String(texto || '').split('\n');
  let html = '';
  const pilha = [];          // listas abertas: {tag, indent}
  let emCode = false;
  let bufCode = [];

  const fecharTudo = () => { while (pilha.length) html += `</${pilha.pop().tag}>`; };
  const fecharMaisProfundas = (indent) => {
    while (pilha.length && pilha[pilha.length - 1].indent > indent) {
      html += `</${pilha.pop().tag}>`;
    }
  };

  for (const raw of linhas) {
    if (raw.trim() === '```') {
      if (emCode) { html += `<pre>${escapeHtml(bufCode.join('\n'))}</pre>`; bufCode = []; emCode = false; }
      else { fecharTudo(); emCode = true; }
      continue;
    }
    if (emCode) { bufCode.push(raw); continue; }
    if (!raw.trim()) continue;

    const mH = raw.match(/^(#{2,3})\s+(.*)$/);
    if (mH) { fecharTudo(); const n = mH[1].length; html += `<h${n}>${inlineMd(mH[2])}</h${n}>`; continue; }

    const mLi = raw.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
    if (mLi) {
      const indent = mLi[1].length;
      const tag = /\d+\./.test(mLi[2]) ? 'ol' : 'ul';
      fecharMaisProfundas(indent);
      const topo = pilha[pilha.length - 1];
      if (!topo || topo.indent < indent) {
        html += `<${tag}>`; pilha.push({ tag, indent });
      } else if (topo.indent === indent && topo.tag !== tag) {
        html += `</${topo.tag}>`; pilha.pop();
        html += `<${tag}>`; pilha.push({ tag, indent });
      }
      html += `<li>${inlineMd(mLi[3])}</li>`;
      continue;
    }

    fecharTudo();
    const conteudo = inlineMd(raw);
    if (/^\s*<img[^>]*>\s*$/.test(conteudo)) html += conteudo;
    else html += `<p>${conteudo}</p>`;
  }
  if (emCode && bufCode.length) html += `<pre>${escapeHtml(bufCode.join('\n'))}</pre>`;
  fecharTudo();
  return html || '<p></p>';
}

function limparEstadoVazio() {
  if (estadoVazio.parentNode) estadoVazio.remove();
}

function adicionarMensagem(autor, texto) {
  limparEstadoVazio();
  const div = document.createElement('div');
  div.className = `msg ${autor}`;
  const bolha = document.createElement('div');
  bolha.className = 'bolha';
  bolha.innerHTML = autor === 'usuario' ? `<p>${escapeHtml(texto)}</p>` : renderMarkdown(texto);
  div.appendChild(bolha);
  mensagensEl.appendChild(div);
  mensagensEl.scrollTop = mensagensEl.scrollHeight;
  return { div, bolha };
}

function mostrarDigitando() {
  limparEstadoVazio();
  const div = document.createElement('div');
  div.className = 'msg assistente';
  div.id = 'digitando-wrap';
  div.innerHTML = `<div class="bolha"><div class="digitando"><span></span><span></span><span></span></div></div>`;
  mensagensEl.appendChild(div);
  mensagensEl.scrollTop = mensagensEl.scrollHeight;
}
function removerDigitando() {
  const el = document.getElementById('digitando-wrap');
  if (el) el.remove();
}

async function perguntar(pergunta) {
  adicionarMensagem('usuario', pergunta);
  mostrarDigitando();
  carregando = true;
  enviarBtn.disabled = true;

  try {
    const r = await fetch('/perguntar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pergunta, historico, sessao_id: sessaoId })
    });
    removerDigitando();
    if (!r.ok) {
      const detalhe = await r.json().catch(() => ({}));
      adicionarMensagem('assistente', `Erro ao consultar o assistente: ${detalhe.detail || r.status}`);
      return;
    }
    const d = await r.json();
    const { div, bolha } = adicionarMensagem('assistente', d.resposta);
    if (d.recusado) div.classList.add('recusado');

    // Artigo(s) na integra — texto + prints — logo abaixo da resposta didatica.
    if (d.artigos && d.artigos.length) {
      for (const a of d.artigos) {
        const det = document.createElement('details');
        det.className = 'artigo-integro';
        det.open = true;
        const sum = document.createElement('summary');
        sum.innerHTML = `<span>Artigo completo: ${escapeHtml(a.titulo)}</span>`
          + `<span class="selo">passo a passo</span>`;
        const corpo = document.createElement('div');
        corpo.className = 'artigo-corpo';
        corpo.innerHTML = renderMarkdown(a.texto);
        if (a.url) {
          const rodape = document.createElement('p');
          rodape.innerHTML = `<a href="${a.url}" target="_blank" rel="noopener">Abrir o artigo no portal</a>`;
          corpo.appendChild(rodape);
        }
        det.appendChild(sum);
        det.appendChild(corpo);
        bolha.appendChild(det);
      }
    }

    if (d.fontes && d.fontes.length) {
      const wrap = document.createElement('div');
      wrap.className = 'fontes';
      const vistos = new Set();
      for (const f of d.fontes) {
        const chave = f.titulo + f.url;
        if (vistos.has(chave)) continue;
        vistos.add(chave);
        const item = document.createElement('div');
        item.className = 'fonte-item';
        item.innerHTML = `<span class="fonte-score">${f.score.toFixed(2)}</span> · <a href="${f.url}" target="_blank" rel="noopener">${escapeHtml(f.titulo)}</a>`;
        wrap.appendChild(item);
      }
      bolha.appendChild(wrap);
    }

    const meta = document.createElement('div');
    meta.className = 'meta-linha';
    const dotClasse = d.melhor_score >= 0.5 ? 'alto' : 'baixo';
    meta.innerHTML = `<span class="dot ${dotClasse}"></span> score ${d.melhor_score.toFixed(3)}${d.modelo ? ' · ' + d.modelo : ''}`;
    bolha.appendChild(meta);

    historico.push(['usuario', pergunta]);
    historico.push(['assistente', d.resposta]);
    historico = historico.slice(-6);
    mensagensEl.scrollTop = mensagensEl.scrollHeight;
  } catch (e) {
    removerDigitando();
    adicionarMensagem('assistente', 'Não consegui falar com o servidor. Tente novamente em instantes.');
  } finally {
    carregando = false;
    enviarBtn.disabled = false;
    campo.focus();
  }
}

composer.addEventListener('submit', (e) => {
  e.preventDefault();
  const texto = campo.value.trim();
  if (!texto || carregando) return;
  campo.value = '';
  campo.style.height = 'auto';
  perguntar(texto);
});

campo.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    composer.requestSubmit();
  }
});
campo.addEventListener('input', () => {
  campo.style.height = 'auto';
  campo.style.height = Math.min(campo.scrollHeight, 120) + 'px';
});

document.querySelectorAll('.chip').forEach((btn) => {
  btn.addEventListener('click', () => perguntar(btn.dataset.q));
});
</script>
</body>
</html>
